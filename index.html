<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to EcoGenius</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0f2f1;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2e7d32;
            font-size: 32px;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .start-btn {
            background-color: #388e3c;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .start-btn:hover {
            background-color: #2e7d32;
            transform: scale(1.05);
        }
        .info {
            margin-top: 20px;
            font-size: 16px;
            color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to EcoGenius</h1>
        <p>Your AI-powered assistant for sustainability and eco-friendly living.</p>
        <button class="start-btn" onclick="startChat()">Go to Dashboard</button>
        <p class="info">Join us in making the world a greener place. Start your journey with EcoGenius today!</p>
    </div>

    <script>
        function startChat() {
            window.location.href = 'EcoSphere/dashboard/index.html'; // Redirect to the dashboard page
        }
    </script>
</body>
</html>
