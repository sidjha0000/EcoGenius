<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EcoGenius</title>
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="icon" href="../image/logo.webp" type="image/webp" sizes="32x32">

    <link rel="icon" href="favicon.ico">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">EcoGenius</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login Form Section -->
    <section id="login">
        <div class="container">
            <h1>Login</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Login</button>
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </form>
            <p id="login-fail-message" style="color:red; display:none;">Invalid username or password. Please try again.</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 EcoGenius. All rights reserved.</p>
    </footer>

    <script src="../scripts/login.js"></script>
</body>
</html>
