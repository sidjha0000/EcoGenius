<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Chatbot - Echosphere</title>
    <link rel="stylesheet" href="../styles/chatbot.css">
    <link rel="icon" href="../image/logo.webp" type="image/webp" sizes="32x32">

</head>
<body>

    <header>
        <h1>🤖 Eco Chatbot</h1>
        <p>Ask any question about sustainability and the environment!</p>
    </header>

    <main class="chat-container">
        <div id="chatbox">
            <div class="bot-message">Hello! Ask me anything about eco-friendly living. 🌱</div>
        </div>
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button onclick="sendMessage()">Send</button>
    </main>

    <script src="../scripts/chatbot.js"></script>

</body>
</html>
